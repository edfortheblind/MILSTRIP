<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Map viewer</title>
<style>
:root{color-scheme:light dark;--bg:#f7fafc;--panel:#fff;--text:#1a202c;--muted:#64748b;--line:#d7dee8;--accent:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--panel:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--line:#374151;--accent:#60a5fa}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:1rem 1.25rem;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:1.2rem;margin:0 0 .3rem}p{margin:.25rem 0;color:var(--muted)}
.controls{margin-top:.75rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
button,.picker{border:1px solid var(--line);border-radius:.4rem;padding:.45rem .7rem;background:var(--panel);color:var(--text);cursor:pointer}
input[type=file]{max-width:24rem}.layout{display:grid;grid-template-columns:minmax(18rem,38%) 1fr;min-height:calc(100vh - 8rem)}
#tree,#detail{padding:1rem 1.25rem}#tree{border-right:1px solid var(--line);background:var(--panel)}
.section{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:1rem 0 .35rem}
.node{padding:.35rem .5rem;border-radius:.35rem;cursor:pointer}.node:hover,.node.selected{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.children{margin-left:1rem;border-left:1px solid var(--line);padding-left:.45rem}.path{font-family:ui-monospace,monospace}.type{margin-left:.5rem;color:var(--muted);font-size:.8rem}
#detail h2{font-family:ui-monospace,monospace;font-size:1.05rem}.meta{color:var(--muted)}a{color:var(--accent)}
.error{color:#dc2626}.hidden{display:none}
.banner{max-width:100%;height:auto;display:block;margin-bottom:.75rem;border-radius:.5rem}
.aekr-footer{display:grid;justify-items:center;padding:1rem 1.25rem 1.25rem;border-top:1px solid var(--line);background:var(--panel)}
.aekr-footer button{display:grid;justify-items:center;gap:.45rem;border:1px solid var(--line);border-radius:.5rem;background:var(--bg);color:inherit;padding:.75rem 1rem;font:inherit;cursor:default;opacity:.9;text-align:center}
.aekr-footer img{display:block;width:min(100%,36rem);height:auto}
.aekr-footer p{font-size:.8rem;color:var(--muted);margin:0}
@media(max-width:760px){.layout{grid-template-columns:1fr}#tree{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <img class="banner" src="assets/aekr-banner.png" alt="AEKR banner">
  <h1>Project Map viewer</h1>
  <p><code>project-map.json</code> is canonical. This page embeds no project data.</p>
  <p id="status">Trying to load <code>project-map.json</code>…</p>
  <div class="controls">
    <label class="picker">Open canonical JSON <input id="file" type="file" accept="application/json,.json"></label>
    <button id="retry" type="button">Retry adjacent file</button>
  </div>
</header>
<main class="layout">
  <section id="tree" aria-label="Project structure"></section>
  <section id="detail"><p>Select a node to see its purpose.</p></section>
</main>
<footer class="aekr-footer">
  <button type="button" disabled aria-disabled="true" aria-label="Build with AEKR — decorative, no action" title="Build with AEKR">
    <img src="assets/aekr-banner.png" alt="Build with AEKR">
    <p>Built with the AI Engineering Knowledge Repo (AEKR) workflow.</p>
  </button>
</footer>
<script>
"use strict";
const tree=document.getElementById("tree"),detail=document.getElementById("detail"),statusEl=document.getElementById("status");

function setStatus(message,isError=false){statusEl.textContent=message;statusEl.className=isError?"error":"";}
function addText(parent,tag,text,className){const el=document.createElement(tag);if(className)el.className=className;el.textContent=text;parent.appendChild(el);return el;}
function showDetail(node){detail.replaceChildren();addText(detail,"h2",node.path||"Unnamed node");addText(detail,"p",node.purpose||"No purpose recorded.");if(node.type)addText(detail,"p",`Type: ${node.type}`,"meta");if(node.note)addText(detail,"p",node.note,"meta");if(node.statusLink){const p=document.createElement("p"),a=document.createElement("a");a.href=node.statusLink;a.textContent="Open current status";a.target="_blank";a.rel="noopener";p.appendChild(a);detail.appendChild(p);}if(node.path&&/\.[A-Za-z0-9]+$/.test(node.path)){const p=document.createElement("p"),a=document.createElement("a");a.href=node.path;a.textContent=`Open ${node.path}`;a.target="_blank";a.rel="noopener";p.appendChild(a);detail.appendChild(p);}}
function renderNode(node,parent){const row=document.createElement("div");row.className="node";addText(row,"span",node.path||"Unnamed","path");if(node.type)addText(row,"span",node.type,"type");row.addEventListener("click",event=>{event.stopPropagation();document.querySelectorAll(".node.selected").forEach(el=>el.classList.remove("selected"));row.classList.add("selected");showDetail(node);});parent.appendChild(row);if(Array.isArray(node.children)&&node.children.length){const children=document.createElement("div");children.className="children";node.children.forEach(child=>renderNode(child,children));parent.appendChild(children);}}
function renderMap(map){if(!map||typeof map!=="object"||!map.repo||!Array.isArray(map.entryPoints)||!Array.isArray(map.topLevelSections))throw new Error("Expected repo, entryPoints, and topLevelSections in project-map.json");tree.replaceChildren();const name=map.repo.alias?`${map.repo.name} (${map.repo.alias})`:map.repo.name;addText(tree,"div",name||"Project","section");addText(tree,"div","Entry points","section");map.entryPoints.forEach(node=>renderNode(node,tree));addText(tree,"div","Structure","section");map.topLevelSections.forEach(node=>renderNode(node,tree));setStatus(`Loaded canonical map: ${map.repo.name||"unnamed project"}.`);}
async function loadAdjacent(){try{const response=await fetch("./project-map.json",{cache:"no-store"});if(!response.ok)throw new Error(`HTTP ${response.status}`);renderMap(await response.json());}catch(error){setStatus("Automatic loading failed (common for file:// pages). Choose project-map.json above.",true);}}
document.getElementById("retry").addEventListener("click",loadAdjacent);
document.getElementById("file").addEventListener("change",event=>{const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{renderMap(JSON.parse(reader.result));}catch(error){setStatus(`Invalid Project Map: ${error.message}`,true);}};reader.onerror=()=>setStatus("Could not read the selected file.",true);reader.readAsText(file);});
loadAdjacent();
</script>
</body>
</html>
