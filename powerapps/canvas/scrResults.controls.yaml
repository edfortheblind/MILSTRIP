- ResultsIcon:
    Control: Image
    Properties:
      X: =24
      Y: =16
      Width: =64
      Height: =64
      Image: ='milstrip-app'
- ResultsTitle:
    Control: Label
    Properties:
      X: =104
      Y: =16
      Width: =Parent.Width-128
      Height: =64
      Text: ="MILSTRIP " & If(AppEnvironment="stage","Stage","Prod") & " | " & "Validation results"
      Size: =24
- ResultsMessage:
    Control: Label
    Properties:
      X: =24
      Y: =84
      Width: =Parent.Width-48
      Height: =60
      Text: =Coalesce(varMessage, "")
- RequestIdentity:
    Control: Label
    Properties:
      X: =24
      Y: =144
      Width: =Parent.Width-48
      Height: =110
      Size: =14
      Text: '="Request: " & varRequestId & Char(10) & If(!IsBlank(varAck.request_id) && varAck.request_id=varRequestId, "Intake
        saved | Received: " & Text(varAck.received_at,DateTimeFormat.ShortDateTime) & Char(10) & "Validation at intake: "
        & Text(varAck.records) & " records | " & Text(varAck.rejected) & " rejected | " & Text(varAck.requires_review) & "
        flagged for review | Delivery: not connected", If(!IsBlank(varRequestDetail.request_id) && varRequestDetail.request_id=varRequestId,
        "Intake saved | Received: " & Text(varRequestDetail.received_at,DateTimeFormat.ShortDateTime) & Char(10) & "Delivery:
        not connected", "Load results to confirm the saved intake."))'
- btnLoadResults:
    Control: Classic/Button
    Properties:
      X: =24
      Y: =272
      Width: =210
      Height: =44
      Text: ="Load / refresh results"
      OnSelect: '=If(Coalesce(varEnvironmentReady,false),Set(varBusy,true); IfError(

        Set(varRequestDetail,MILSTRIPLocalDevAPI.GetIntakeRequest(varRequestId)); varRequestDetail,

        Set(varMessage,"Results unavailable. Retained data may be stale; reload before reviewing."); Set(varLoadedRequest,Blank());
        false,

        Set(varRecordsPage,MILSTRIPLocalDevAPI.ListRecordResults(varRequestId,{limit:50})); varRecordsPage,

        Set(varMessage,"Results unavailable. Retained data may be stale; reload before reviewing."); Set(varLoadedRequest,Blank());
        false,

        ClearCollect(colRecords,varRecordsPage.items); Set(varRecordsCursor,varRecordsPage.next_cursor); Set(varRecordPageCursor,Blank());
        Set(varLoadedRequest,varRequestId); Set(varMessage,""); true); Set(varBusy,false),Notify("Environment unavailable.
        Return to Intake and check the connection.",NotificationType.Error))'
      DisplayMode: =If(!Coalesce(varEnvironmentReady,false),DisplayMode.Disabled,If(Coalesce(varBusy,false),DisplayMode.Disabled,DisplayMode.Edit))
- btnNextRecords:
    Control: Classic/Button
    Properties:
      X: =254
      Y: =272
      Width: =210
      Height: =44
      Text: ="Next results page"
      OnSelect: '=If(Coalesce(varEnvironmentReady,false),Set(varBusy,true); IfError(

        Set(varRecordsPage,MILSTRIPLocalDevAPI.ListRecordResults(varRequestId,{limit:50,cursor:varRecordsCursor})); varRecordsPage,

        Set(varMessage,"Next page failed. Existing results and cursor retained."); false,

        Set(varRecordPageCursor,varRecordsCursor); ClearCollect(colRecords,varRecordsPage.items); Set(varRecordsCursor,varRecordsPage.next_cursor);
        true); Set(varBusy,false),Notify("Environment unavailable. Return to Intake and check the connection.",NotificationType.Error))'
      DisplayMode: =If(!Coalesce(varEnvironmentReady,false),DisplayMode.Disabled,If(Coalesce(varBusy,false) || IsBlank(varRecordsCursor)
        || varLoadedRequest<>varRequestId,DisplayMode.Disabled,DisplayMode.Edit))
- btnHistory:
    Control: Classic/Button
    Properties:
      X: =484
      Y: =272
      Width: =210
      Height: =44
      Text: ="History"
      OnSelect: =Navigate(scrHistory)
      DisplayMode: =If(!Coalesce(varEnvironmentReady,false),DisplayMode.Disabled,If(Coalesce(varBusy,false),DisplayMode.Disabled,DisplayMode.Edit))
- btnBackToIntake:
    Control: Classic/Button
    Properties:
      X: =714
      Y: =272
      Width: =210
      Height: =44
      Text: ="Intake"
      OnSelect: =Navigate(scrIntake)
      DisplayMode: =If(Coalesce(varBusy,false),DisplayMode.Disabled,DisplayMode.Edit)
- galRecords:
    Control: Gallery
    Properties:
      X: =24
      Y: =332
      Width: =Parent.Width-48
      Height: =Parent.Height-352
      Items: =If(varLoadedRequest=varRequestId,colRecords,Filter(colRecords,false))
      TemplateSize: =150
    Variant: Vertical
    Children:
    - RecordSummary:
        Control: Label
        Properties:
          X: =0
          Y: =0
          Width: =Parent.TemplateWidth-220
          Height: =50
          Text: '="Record " & Text(ThisItem.record_sequence) & " | " & ThisItem.status & " | review: " & Coalesce(Text(ThisItem.latest_review.decision),"NONE")'
    - RecordIssues:
        Control: Label
        Properties:
          X: =0
          Y: =50
          Width: =Parent.TemplateWidth-220
          Height: =85
          Text: '=Concat(ThisItem.issues,issue_code & ": " & message,Char(10))'
    - btnOpenReview:
        Control: Classic/Button
        Properties:
          X: =Parent.TemplateWidth-215
          Y: =0
          Width: =210
          Height: =44
          Text: ="Inspect / review"
          OnSelect: =Set(varRecord,ThisItem); Set(varMessage,""); Navigate(scrReview)
          DisplayMode: =If(!Coalesce(varEnvironmentReady,false),DisplayMode.Disabled,If(Coalesce(varBusy,false) || !IsBlank(varPending.command_id),DisplayMode.Disabled,DisplayMode.Edit))
