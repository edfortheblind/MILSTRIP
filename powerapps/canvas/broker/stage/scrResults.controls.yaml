      Y: =144
      Width: =Parent.Width-48
      Height: =110
      Size: =14
      Text: '="Request: " & varRequestId & Char(10) & If(!IsBlank(varAck.request_id) && varAck.request_id=varRequestId,
        "Intake saved | Received: " & Text(varAck.received_at,DateTimeFormat.ShortDateTime) & Char(10) & "Validation
        at intake: " & Text(varAck.records) & " records | " & Text(varAck.rejected) & " rejected | " & Text(varAck.requires_review)
