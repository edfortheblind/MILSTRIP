- galRecords:
    Control: Gallery
    Properties:
      X: =24
      Y: =332
      Width: =Parent.Width-48
      Height: =Parent.Height-352
      Items: =If(varLoadedRequest=varRequestId,colRecords,Filter(colRecords,false))
      TemplateSize: =150
      AccessibleLabel: ="Validation results"
      ItemAccessibleLabel: ="Record " & Text(ThisItem.record_sequence) & ", " & ThisItem.status & ", " & Text(CountRows(ThisItem.issues))
        & " validation issues"
    Variant: Vertical
    Children:
    - RecordSummary:
        Control: Label
        Properties:
          X: =0
          Y: =0
          Width: =Parent.TemplateWidth-220
          Height: =50
          Text: '="Record " & Text(ThisItem.record_sequence) & " | " & ThisItem.status & " | review: " & Coalesce(Text(ThisItem.latest_review.decision),"NONE")'
    - RecordIssues:
        Control: Label
        Properties:
          X: =0
          Y: =50
          Width: =Parent.TemplateWidth-220
          Height: =85
          Text: '=Concat(ThisItem.issues,issue_code & ": " & message,Char(10))'
    - btnOpenReview:
        Control: Classic/Button
        Properties:
          X: =Parent.TemplateWidth-215
          Y: =0
          Width: =210
          Height: =44
          Text: ="Review record " & Text(ThisItem.record_sequence)
          OnSelect: =Set(varRecord,ThisItem); Set(varMessage,""); Navigate(scrReview)
          DisplayMode: =If(!Coalesce(varEnvironmentReady,false),DisplayMode.Disabled,If(Coalesce(varBusy,false)
            || !IsBlank(varPending.command_id),DisplayMode.Disabled,DisplayMode.Edit))
          TabIndex: =0
          FocusedBorderThickness: =3
          FocusedBorderColor: =Self.Color
