- ReviewIcon:
    Control: Image
    Properties:
      X: =24
      Y: =16
      Width: =64
      Height: =64
      Image: ='milstrip-app'
- ReviewTitle:
    Control: Label
    Properties:
      X: =104
      Y: =16
      Width: =Parent.Width-128
      Height: =64
      Text: ="MILSTRIP " & If(AppEnvironment="stage","Stage","Prod") & " | " & "Operator review"
      Size: =24
- ReviewMessage:
    Control: Label
    Properties:
      X: =24
      Y: =84
      Width: =Parent.Width-48
      Height: =60
      Text: =Coalesce(varMessage, "")
      Live: =Live.Polite
- ReviewIdentity:
    Control: Label
    Properties:
      X: =24
      Y: =144
      Width: =Parent.Width-48
      Height: =42
      Text: '=varRecord.record_id & " | validation: " & varRecord.status & " | version: " & Text(varRecord.review_version)'
- CanonicalLabel:
    Control: Label
    Properties:
      X: =24
      Y: =188
      Width: =Parent.Width-48
      Height: =42
      Text: '="Canonical length: " & Text(Len(varRecord.canonical_record)) & " (trailing spaces preserved)"'
- txtCanonical:
    Control: Classic/TextInput
    Properties:
      X: =24
      Y: =234
      Width: =Parent.Width-48
      Height: =70
      Default: =varRecord.canonical_record
      Mode: =TextMode.MultiLine
      DisplayMode: =DisplayMode.View
      Font: ="Courier New"
      AccessibleLabel: ="Canonical MILSTRIP record, read only"
      TabIndex: =0
      FocusedBorderThickness: =3
      FocusedBorderColor: =RGBA(0,0,0,1)
- ReviewIssues:
    Control: Label
    Properties:
      X: =24
      Y: =310
      Width: =Parent.Width-48
      Height: =80
      Text: '=Concat(varRecord.issues,issue_code & ": " & message,Char(10))'
- ddDecision:
    Control: Classic/DropDown
    Properties:
      X: =24
      Y: =400
      Width: =220
      Height: =44
      Items: =["REJECTED","APPROVED"]
      Default: ="REJECTED"
      DisplayMode: =If(!Coalesce(varEnvironmentReady,false),DisplayMode.Disabled,If(Coalesce(varBusy,false) || !IsBlank(varPending.command_id),DisplayMode.Disabled,DisplayMode.Edit))
      AccessibleLabel: ="Review decision"
      TabIndex: =0
      FocusedBorderThickness: =3
      FocusedBorderColor: =RGBA(0,0,0,1)
- txtReason:
    Control: Classic/TextInput
    Properties:
      X: =264
      Y: =400
      Width: =Parent.Width-288
      Height: =110
      Default: =""
      HintText: ="Reason required (1-1000 characters)"
      MaxLength: =1000
      Mode: =TextMode.MultiLine
      DisplayMode: =If(!Coalesce(varEnvironmentReady,false),DisplayMode.Disabled,If(Coalesce(varBusy,false) || !IsBlank(varPending.command_id),DisplayMode.Disabled,DisplayMode.Edit))
      AccessibleLabel: ="Review reason, required"
      TabIndex: =0
      FocusedBorderThickness: =3
      FocusedBorderColor: =RGBA(0,0,0,1)
