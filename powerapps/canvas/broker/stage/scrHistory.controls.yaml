    Properties:
      X: =24
      Y: =16
      Width: =64
      Height: =64
      Image: ='milstrip-app'
- HistoryTitle:
    Control: Label
    Properties:
      X: =104
      Y: =16
      Width: =Parent.Width-128
      Height: =64
      Text: ="MILSTRIP " & If(AppEnvironment="stage","Stage","Prod") & " | " & "Audit history"
      Size: =24
- HistoryMessage:
