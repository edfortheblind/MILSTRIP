- btnHistoryBack:
    Control: Classic/Button
    Properties:
      X: =484
      Y: =200
      Width: =210
      Height: =44
      Text: ="Results"
      OnSelect: =Navigate(scrResults)
      DisplayMode: =If(Coalesce(varBusy,false),DisplayMode.Disabled,DisplayMode.Edit)
      TabIndex: =0
      FocusedBorderThickness: =3
      FocusedBorderColor: =Self.Color
- galHistory:
    Control: Gallery
    Properties:
      X: =24
      Y: =260
      Width: =Parent.Width-48
      Height: =Parent.Height-280
      Items: =If(varHistoryRequest=varRequestId,colEvents,Filter(colEvents,false))
      TemplateSize: =132
      AccessibleLabel: ="Request audit history"
      ItemAccessibleLabel: =ThisItem.event_type & ", " & Text(ThisItem.occurred_at,DateTimeFormat.ShortDateTime)
        & ", actor " & Coalesce(ThisItem.actor,"not recorded")
    Variant: Vertical
    Children:
    - EventSummary:
        Control: Label
        Properties:
          X: =0
          Y: =0
          Width: =Parent.TemplateWidth
          Height: =44
          Text: =Text(ThisItem.occurred_at) & " | " & ThisItem.event_type & " | " & Coalesce(ThisItem.actor, "")
    - EventData:
        Control: Label
        Properties:
          X: =0
          Y: =46
          Width: =Parent.TemplateWidth
          Height: =80
          Text: '=ThisItem.aggregate_type & ": " & ThisItem.aggregate_id & " | event " & Text(ThisItem.event_id)'
