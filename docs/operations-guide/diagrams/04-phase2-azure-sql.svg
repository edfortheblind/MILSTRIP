<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc">
<title id="title">P2.1 architecture: Azure SQL production</title><desc id="desc">P2.1 architecture: Azure SQL production. PROPOSED. Full text equivalent is in the operating guide.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758c"/></marker></defs>
<rect width="1000" height="880" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="48" font-size="29" font-weight="700" fill="#142b45" text-anchor="start">P2.1 architecture: Azure SQL production</text><rect x="30" y="68" width="108" height="30" rx="15" fill="#315fc1"/><text x="44" y="89" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">PROPOSED</text><text x="30" y="126" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">PROPOSED deployment. Adapter implemented; Azure SQL runtime acceptance is pending.</text><g data-node="app"><rect x="30" y="160" width="280" height="126" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="30" y="172" width="4" height="102" rx="2" fill="#315fc1"/><text x="46" y="190" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Published canvas app</text><text x="46" y="216" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Same intake / review contract</text><text x="46" y="239" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Per-user Entra sign-in</text><text x="46" y="262" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Production release gate</text></g><g data-node="api"><rect x="360" y="160" width="280" height="126" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="360" y="172" width="4" height="102" rx="2" fill="#315fc1"/><text x="376" y="190" font-size="20.718462823725982" font-weight="700" fill="#142b45" text-anchor="start">Managed network hosts</text><text x="376" y="216" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">API + gateway off the laptop</text><text x="376" y="239" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">TAB SSO through broker</text><text x="376" y="262" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Hostnames pending</text></g><g data-node="adapter"><rect x="690" y="160" width="280" height="126" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="690" y="172" width="4" height="102" rx="2" fill="#315fc1"/><text x="706" y="190" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">SQL repository</text><text x="706" y="216" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">SQLAlchemy + ODBC adapter</text><text x="706" y="239" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Stable IDs / review versions</text><text x="706" y="262" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Bounded calls + transactions</text></g><polyline points="310,223 360,223" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,223 690,223" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="355" width="960" height="285" rx="14" fill="#ecf2ff" stroke="#315fc1" stroke-opacity=".25"/><text x="36" y="383" font-size="17" font-weight="700" fill="#315fc1" text-anchor="start">EXISTING AZURE SQL WORKBENCH  /  new application objects need explicit approval</text><g data-node="metadata"><rect x="45" y="415" width="275" height="126" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="45" y="427" width="4" height="102" rx="2" fill="#315fc1"/><text x="61" y="445" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">milstrip_app</text><text x="61" y="471" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Intake, review and audit</text><text x="61" y="494" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Durable command ledger</text><text x="61" y="517" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Proposed application schema</text></g><g data-node="release"><rect x="365" y="415" width="275" height="126" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="365" y="427" width="4" height="102" rx="2" fill="#a86b0c"/><text x="381" y="445" font-size="20.30075187969925" font-weight="700" fill="#142b45" text-anchor="start">Gated release adapter</text><text x="381" y="471" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Latest approved version</text><text x="381" y="494" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Reference / duplicate checks</text><text x="381" y="517" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">One atomic business effect</text></g><g data-node="legacy"><rect x="685" y="415" width="275" height="126" rx="10" fill="#ffffff" stroke="#53657d" stroke-width="1.7"/><rect x="685" y="427" width="4" height="102" rx="2" fill="#53657d"/><text x="701" y="445" font-size="20.30075187969925" font-weight="700" fill="#142b45" text-anchor="start">Existing dbo contract</text><text x="701" y="471" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">staging_download_shipMILS</text><text x="701" y="494" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">direct to download_ship940</text><text x="701" y="517" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Not staging_download_ship940</text></g><polyline points="830,286 830,323 182,323 182,415" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="320,478 365,478" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><polyline points="640,478 685,478" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="45" y="583" font-size="20" font-weight="400" fill="#142b45" text-anchor="start">Reuse existing production SQL capacity; confirm source authority before writes.</text><text x="45" y="615" font-size="19" font-weight="400" fill="#142b45" text-anchor="start">G0: reconcile SQL freeze. G1: select SQL or Rainbow delivery. No dual release route.</text><g data-node="ops"><rect x="30" y="701" width="460" height="126" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="30" y="713" width="4" height="102" rx="2" fill="#315fc1"/><text x="46" y="731" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Production operations</text><text x="46" y="757" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Individual audit; service-to-DB identity</text><text x="46" y="780" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Monitoring, restores, bounded capacity</text><text x="46" y="803" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">No dependency on the DEV laptop</text></g><g data-node="downstream"><rect x="545" y="701" width="425" height="126" rx="10" fill="#ffffff" stroke="#53657d" stroke-width="1.7"/><rect x="545" y="713" width="4" height="102" rx="2" fill="#53657d"/><text x="561" y="731" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Existing downstream owners</text><text x="561" y="757" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">ADF / ShipMaster / Boomi / SCALE</text><text x="561" y="780" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Observe agreed acknowledgement</text><text x="561" y="803" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">SQL commit is not shipment confirmation</text></g><polyline points="820,541 990,541 990,674 757,674 757,701" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="30" y="862" font-size="14" font-weight="400" fill="#60758c" text-anchor="start">MILSTRIP  |  September 25, 2026  |  Version 1.5.0</text></g></svg>