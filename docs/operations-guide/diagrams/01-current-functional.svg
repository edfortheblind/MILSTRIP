<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
<title id="title">Functional flow: what the app does today</title><desc id="desc">Functional flow: what the app does today. CURRENT DEV. Full text equivalent is in the operating guide.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758c"/></marker></defs>
<rect width="1000" height="850" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="48" font-size="29" font-weight="700" fill="#142b45" text-anchor="start">Functional flow: what the app does today</text><rect x="30" y="68" width="138" height="30" rx="15" fill="#087f6c"/><text x="44" y="89" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">CURRENT DEV</text><text x="30" y="126" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">The app ends at review and audit. The manual production route is separate.</text><rect x="20" y="150" width="960" height="400" rx="14" fill="#e8f5f1" stroke="#087f6c" stroke-opacity=".25"/><text x="36" y="178" font-size="17" font-weight="700" fill="#087f6c" text-anchor="start">CURRENT DEV  /  implemented and tested with synthetic input</text><g data-node="source"><rect x="40" y="205" width="280" height="102" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="40" y="217" width="4" height="78" rx="2" fill="#087f6c"/><text x="56" y="235" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Original source</text><text x="56" y="261" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Email or ticket text</text><text x="56" y="284" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Pasted by the operator</text></g><g data-node="intake"><rect x="360" y="205" width="280" height="102" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="360" y="217" width="4" height="78" rx="2" fill="#087f6c"/><text x="376" y="235" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Submit intake</text><text x="376" y="261" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Save Request ID and source</text><text x="376" y="284" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Local application metadata</text></g><g data-node="parser"><rect x="680" y="205" width="280" height="102" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="680" y="217" width="4" height="78" rx="2" fill="#087f6c"/><text x="696" y="235" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Parse and validate</text><text x="696" y="261" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Conservative normalization</text><text x="696" y="284" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Preserve / pad to 80 chars</text></g><polyline points="320,255 360,255" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,255 680,255" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><g data-node="results"><rect x="680" y="390" width="280" height="122" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="680" y="402" width="4" height="98" rx="2" fill="#087f6c"/><text x="696" y="420" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Record results</text><text x="696" y="446" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">VALID / REQUIRES_REVIEW</text><text x="696" y="469" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">or REJECTED</text><text x="696" y="492" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Issues stay visible</text></g><g data-node="review"><rect x="360" y="390" width="280" height="122" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="360" y="402" width="4" height="98" rx="2" fill="#087f6c"/><text x="376" y="420" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Human review</text><text x="376" y="446" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">APPROVED or REJECTED</text><text x="376" y="469" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Reason + version required</text><text x="376" y="492" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Invalid approval blocked</text></g><g data-node="audit"><rect x="40" y="390" width="280" height="122" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="40" y="402" width="4" height="98" rx="2" fill="#087f6c"/><text x="56" y="420" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Audit and history</text><text x="56" y="446" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Authenticated actor saved</text><text x="56" y="469" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Review is not delivery</text><text x="56" y="492" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">No operational write</text></g><polyline points="820,307 820,390" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="680,451 640,451" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="360,451 320,451" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="590" width="960" height="200" rx="14" fill="#f0f3f7" stroke="#53657d" stroke-opacity=".25"/><text x="36" y="618" font-size="17" font-weight="700" fill="#53657d" text-anchor="start">EXISTING MANUAL  /  recorded production context, not invoked by this app</text><g data-node="raw"><rect x="40" y="645" width="200" height="108" rx="10" fill="#ffffff" stroke="#53657d" stroke-width="1.7"/><rect x="40" y="657" width="4" height="84" rx="2" fill="#53657d"/><text x="56" y="675" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Raw MILS</text><text x="56" y="701" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">SQL raw staging</text><text x="56" y="724" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Operator input</text></g><g data-node="batch"><rect x="280" y="645" width="200" height="108" rx="10" fill="#ffffff" stroke="#53657d" stroke-width="1.7"/><rect x="280" y="657" width="4" height="84" rx="2" fill="#53657d"/><text x="296" y="675" font-size="18.42105263157895" font-weight="700" fill="#142b45" text-anchor="start">Manual SQL batch</text><text x="296" y="701" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Reference checks</text><text x="296" y="724" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">ERP-order duplicates</text></g><g data-node="940"><rect x="520" y="645" width="200" height="108" rx="10" fill="#ffffff" stroke="#53657d" stroke-width="1.7"/><rect x="520" y="657" width="4" height="84" rx="2" fill="#53657d"/><text x="536" y="675" font-size="18.42105263157895" font-weight="700" fill="#142b45" text-anchor="start">download_ship940</text><text x="536" y="701" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Direct insert target</text><text x="536" y="724" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Not 940 staging</text></g><g data-node="downstream"><rect x="760" y="645" width="200" height="108" rx="10" fill="#ffffff" stroke="#53657d" stroke-width="1.7"/><rect x="760" y="657" width="4" height="84" rx="2" fill="#53657d"/><text x="776" y="675" font-size="15.512465373961222" font-weight="700" fill="#142b45" text-anchor="start">Existing downstream</text><text x="776" y="701" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">ADF / ShipMaster</text><text x="776" y="724" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Boomi / SCALE</text></g><polyline points="240,699 280,699" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,699 520,699" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="720,699 760,699" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="832" font-size="14" font-weight="400" fill="#60758c" text-anchor="start">MILSTRIP  |  September 23, 2026  |  Public guide v1.1.1 | Recorded state, not live service status</text></g></svg>