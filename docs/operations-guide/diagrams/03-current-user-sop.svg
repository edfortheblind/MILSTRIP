<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title desc">
<title id="title">Operator procedure</title><desc id="desc">Operator procedure. CURRENT. Full text equivalent is in the operating guide.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758c"/></marker></defs>
<rect width="1000" height="940" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="48" font-size="29" font-weight="700" fill="#142b45" text-anchor="start">Operator procedure</text><rect x="30" y="68" width="98" height="30" rx="15" fill="#087f6c"/><text x="44" y="89" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">CURRENT</text><text x="30" y="126" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">Use the intended environment; confirm availability before entering source text.</text><g data-node="source"><rect x="30" y="155" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="167" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="185" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">1  Enter the source</text><text x="46" y="211" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Paste the original email or ticket text.</text><text x="46" y="234" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Obtain missing values from the source owner.</text></g><g data-node="submit"><rect x="30" y="280" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="292" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="310" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">2  Submit the intake</text><text x="46" y="336" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Select Submit intake once.</text><text x="46" y="359" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Confirm Intake saved, Request ID and received time.</text></g><g data-node="inspect"><rect x="30" y="405" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="417" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="435" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">3  Inspect the results</text><text x="46" y="461" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Load / refresh results, then Inspect / review.</text><text x="46" y="484" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Read each issue; use Next results page if enabled.</text></g><g data-node="save"><rect x="30" y="530" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="542" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="560" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">4  Record your decision</text><text x="46" y="586" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Choose APPROVED or REJECTED; enter a reason.</text><text x="46" y="609" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Select Save review. Invalid approval is disabled.</text></g><g data-node="verify"><rect x="30" y="655" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="667" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="685" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">5  Verify the saved review</text><text x="46" y="711" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Check the saved message and updated version.</text><text x="46" y="734" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Return to Results; Load / refresh results.</text></g><g data-node="history"><rect x="30" y="780" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="792" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="810" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">6  Verify the audit event</text><text x="46" y="836" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">History → Load / refresh history.</text><text x="46" y="859" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Find REVIEW_DECIDED for the same record.</text></g><polyline points="315,259 315,280" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="315,384 315,405" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="315,509 315,530" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="315,634 315,655" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="315,759 315,780" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><g data-node="unknown"><rect x="650" y="280" width="320" height="127" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="650" y="292" width="4" height="103" rx="2" fill="#a86b0c"/><text x="666" y="310" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Submission uncertain</text><text x="666" y="336" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Load recent requests; match</text><text x="666" y="359" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">the displayed source ID.</text><text x="666" y="382" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Owner confirms not saved.</text></g><polyline points="600,332 650,332" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g data-node="invalid"><rect x="650" y="430" width="320" height="127" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="650" y="442" width="4" height="103" rx="2" fill="#a86b0c"/><text x="666" y="460" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Validation REJECTED</text><text x="666" y="486" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Obtain corrected source.</text><text x="666" y="509" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Submit a new intake.</text><text x="666" y="532" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Retain both Request IDs.</text></g><polyline points="600,457 625,457 625,493 650,493" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g data-node="retry"><rect x="650" y="580" width="320" height="149" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="650" y="592" width="4" height="125" rx="2" fill="#a86b0c"/><text x="666" y="610" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Review exception</text><text x="666" y="636" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Unknown: Retry same command.</text><text x="666" y="659" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Keep decision and reason.</text><text x="666" y="682" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Conflict: Reload after conflict;</text><text x="666" y="705" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">inspect, then decide again.</text></g><polyline points="600,582 625,582 625,654 650,654" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g data-node="restart"><rect x="650" y="760" width="320" height="149" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="650" y="772" width="4" height="125" rx="2" fill="#a86b0c"/><text x="666" y="790" font-size="20.210526315789476" font-weight="700" fill="#142b45" text-anchor="start">App closed or unavailable</text><text x="666" y="816" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Reload after service recovery.</text><text x="666" y="839" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">On restart, reconcile requests</text><text x="666" y="862" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">and history before resubmitting.</text><text x="666" y="885" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Give support IDs and errors.</text></g><text x="30" y="922" font-size="14" font-weight="400" fill="#60758c" text-anchor="start">MILSTRIP  |  September 25, 2026  |  Version 1.5.0</text></g></svg>