<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="title desc">
<title id="title">End-user SOP: use the current app</title><desc id="desc">End-user SOP: use the current app. CURRENT DEV. Full text equivalent is in the operating guide.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758c"/></marker></defs>
<rect width="1000" height="1040" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="48" font-size="29" font-weight="700" fill="#142b45" text-anchor="start">End-user SOP: use the current app</text><rect x="30" y="68" width="138" height="30" rx="15" fill="#087f6c"/><text x="44" y="89" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">CURRENT DEV</text><text x="30" y="126" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">Authorized development testing only. Exact button names match the existing screens.</text><g data-node="open"><rect x="30" y="155" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="167" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="185" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">1  Open Preview</text><text x="46" y="211" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Owner confirms API, database and gateway are ready.</text><text x="46" y="234" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Use approved test input; start on MILSTRIP intake.</text></g><g data-node="submit"><rect x="30" y="280" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="292" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="310" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">2  Paste, then Submit intake</text><text x="46" y="336" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Click once. Keep the original text.</text><text x="46" y="359" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Continue only when a Request ID is returned.</text></g><g data-node="load"><rect x="30" y="405" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="417" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="435" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">3  Load / refresh results</text><text x="46" y="461" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Inspect every record and issue.</text><text x="46" y="484" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Use Next results page when enabled.</text></g><g data-node="inspect"><rect x="30" y="530" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="542" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="560" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">4  Inspect / review</text><text x="46" y="586" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Read canonical length and validation status.</text><text x="46" y="609" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Do not edit, trim or invent business values.</text></g><g data-node="save"><rect x="30" y="655" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="667" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="685" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">5  Save review</text><text x="46" y="711" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Choose APPROVED or REJECTED; enter a reason.</text><text x="46" y="734" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Check the saved message and review version.</text></g><g data-node="history"><rect x="30" y="780" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="792" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="810" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">6  History → Load / refresh history</text><text x="46" y="836" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Verify the event; use More history if enabled.</text><text x="46" y="859" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Refresh Results before relying on old review rows.</text></g><g data-node="finish"><rect x="30" y="905" width="570" height="104" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="917" width="4" height="80" rx="2" fill="#087f6c"/><text x="46" y="935" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">7  Keep the Request ID</text><text x="46" y="961" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Current app has no release or shipment action.</text><text x="46" y="984" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Approval does not mean sent or shipped.</text></g><polyline points="315,259 315,280" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="315,384 315,405" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="315,509 315,530" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="315,634 315,655" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="315,759 315,780" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="315,884 315,905" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><g data-node="unknown"><rect x="650" y="280" width="320" height="127" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="650" y="292" width="4" height="103" rx="2" fill="#a86b0c"/><text x="666" y="310" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Submission uncertain</text><text x="666" y="336" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Load recent requests; match</text><text x="666" y="359" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">the displayed source ID.</text><text x="666" y="382" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Confirm absence before retry.</text></g><polyline points="600,332 650,332" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g data-node="invalid"><rect x="650" y="450" width="320" height="127" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="650" y="462" width="4" height="103" rx="2" fill="#a86b0c"/><text x="666" y="480" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Validation REJECTED</text><text x="666" y="506" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Obtain corrected source.</text><text x="666" y="529" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Submit a new intake.</text><text x="666" y="552" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Approval is disabled.</text></g><polyline points="600,582 625,582 625,514 650,514" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g data-node="retry"><rect x="650" y="640" width="320" height="127" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="650" y="652" width="4" height="103" rx="2" fill="#a86b0c"/><text x="666" y="670" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Review exception</text><text x="666" y="696" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Unknown: Retry same command.</text><text x="666" y="719" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Conflict: Reload after conflict;</text><text x="666" y="742" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">inspect, then decide again.</text></g><polyline points="600,707 650,707" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g data-node="restart"><rect x="650" y="830" width="320" height="149" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="650" y="842" width="4" height="125" rx="2" fill="#a86b0c"/><text x="666" y="860" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">If the app closes</text><text x="666" y="886" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Pending inputs are in memory.</text><text x="666" y="909" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Reconcile requests / history.</text><text x="666" y="932" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Give support IDs and errors;</text><text x="666" y="955" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">never passwords or raw orders.</text></g><text x="30" y="1022" font-size="14" font-weight="400" fill="#60758c" text-anchor="start">MILSTRIP  |  September 23, 2026  |  See guide.md for evidence and acceptance limits</text></g></svg>