<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-labelledby="title desc">
<title id="title">Two periods: qualify, switch, stabilize</title><desc id="desc">Two periods: qualify, switch, stabilize. PROPOSED. Full text equivalent is in the operating guide.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758c"/></marker></defs>
<rect width="1000" height="860" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="48" font-size="29" font-weight="700" fill="#142b45" text-anchor="start">Two periods: qualify, switch, stabilize</text><rect x="30" y="68" width="108" height="30" rx="15" fill="#315fc1"/><text x="44" y="89" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">PROPOSED</text><text x="30" y="126" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">Q4 2026 is the owner&#x27;s target. Dates never override the acceptance gates.</text><g data-node="now"><rect x="30" y="165" width="280" height="145" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="30" y="177" width="4" height="121" rx="2" fill="#087f6c"/><text x="46" y="195" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">NOW / September 23</text><text x="46" y="221" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Unpublished working DEV app</text><text x="46" y="244" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">SQL manual authority retained</text><text x="46" y="267" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Freeze, route, identity gates</text><text x="46" y="290" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Finish canvas acceptance</text></g><g data-node="p21"><rect x="360" y="165" width="280" height="145" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="360" y="177" width="4" height="121" rx="2" fill="#315fc1"/><text x="376" y="195" font-size="20.718462823725982" font-weight="700" fill="#142b45" text-anchor="start">P2.1 / target October</text><text x="376" y="221" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Published production pilot</text><text x="376" y="244" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Existing Azure SQL DB</text><text x="376" y="267" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">API moved off laptop</text><text x="376" y="290" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Measured load and operations</text></g><g data-node="p22"><rect x="690" y="165" width="280" height="145" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="690" y="177" width="4" height="121" rx="2" fill="#315fc1"/><text x="706" y="195" font-size="19.77671451355662" font-weight="700" fill="#142b45" text-anchor="start">P2.2 / target December</text><text x="706" y="221" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Accepted PG Production</text><text x="706" y="244" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">One writer switch</text><text x="706" y="267" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Stable IDs / history / commands</text><text x="706" y="290" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Qualified downstream flow</text></g><polyline points="310,237 360,237" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><polyline points="640,237 690,237" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="20" y="365" width="960" height="155" rx="14" fill="#fff3da" stroke="#a86b0c" stroke-opacity=".25"/><text x="36" y="393" font-size="17" font-weight="700" fill="#a86b0c" text-anchor="start">BEFORE CUTOVER  /  two-month MILSTRIP controlled comparison</text><text x="45" y="424" font-size="20" font-weight="400" fill="#142b45" text-anchor="start">SQL remains authoritative; PG comparison does not create duplicate production effects.</text><text x="45" y="457" font-size="20" font-weight="400" fill="#142b45" text-anchor="start">Start no later than October 31 for a full two-month window ending December 31.</text><text x="45" y="490" font-size="19" font-weight="400" fill="#142b45" text-anchor="start">Late readiness means a later date or an explicit gate change, not skipped evidence.</text><rect x="20" y="550" width="960" height="155" rx="14" fill="#fff3da" stroke="#a86b0c" stroke-opacity=".25"/><text x="36" y="578" font-size="17" font-weight="700" fill="#a86b0c" text-anchor="start">AFTER PG PRODUCTION ACCEPTANCE  /  30 stable days of SQL retention</text><text x="45" y="608" font-size="20" font-weight="400" fill="#142b45" text-anchor="start">Frozen SQL is a rollback baseline, not an automatic live fallback for new PG writes.</text><text x="45" y="641" font-size="20" font-weight="400" fill="#142b45" text-anchor="start">December 31 go-live pushes this window into January 2027.</text><text x="45" y="674" font-size="19" font-weight="400" fill="#142b45" text-anchor="start">End-Q4 retirement instead requires acceptance around December 1 and a stable window.</text><g data-node="cutover"><rect x="30" y="744" width="940" height="72" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="30" y="756" width="4" height="48" rx="2" fill="#315fc1"/><text x="46" y="774" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Cutover sequence</text><text x="46" y="800" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Quiesce → capture → reconcile → switch once → observe → separately approve retirement</text></g><text x="30" y="842" font-size="14" font-weight="400" fill="#60758c" text-anchor="start">MILSTRIP  |  September 23, 2026  |  Public guide v1.1.1 | Recorded state, not live service status</text></g></svg>