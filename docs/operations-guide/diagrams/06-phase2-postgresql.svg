<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
<title id="title">P2.2 architecture: PostgreSQL production</title><desc id="desc">P2.2 architecture: PostgreSQL production. PROPOSED. Full text equivalent is in the operating guide.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758c"/></marker></defs>
<rect width="1000" height="920" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="48" font-size="29" font-weight="700" fill="#142b45" text-anchor="start">P2.2 architecture: PostgreSQL production</text><rect x="30" y="68" width="108" height="30" rx="15" fill="#315fc1"/><text x="44" y="89" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">PROPOSED</text><text x="30" y="126" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">PROPOSED. Switch only after migration, business parity and production acceptance.</text><g data-node="app"><rect x="30" y="155" width="280" height="103" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="30" y="167" width="4" height="79" rx="2" fill="#315fc1"/><text x="46" y="185" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Same published app</text><text x="46" y="211" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Stable workflow and IDs</text><text x="46" y="234" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Individual reviewer identity</text></g><g data-node="api"><rect x="360" y="155" width="280" height="103" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="360" y="167" width="4" height="79" rx="2" fill="#315fc1"/><text x="376" y="185" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Same API contract</text><text x="376" y="211" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Qualified PG repository</text><text x="376" y="234" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Accepted release adapter</text></g><g data-node="config"><rect x="690" y="155" width="280" height="103" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="690" y="167" width="4" height="79" rx="2" fill="#a86b0c"/><text x="706" y="185" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">One writer setting</text><text x="706" y="211" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Server-side configuration</text><text x="706" y="234" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">SQL writers fenced at cutover</text></g><polyline points="310,207 360,207" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,207 690,207" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="330" width="960" height="345" rx="14" fill="#ecf2ff" stroke="#315fc1" stroke-opacity=".25"/><text x="36" y="358" font-size="17" font-weight="700" fill="#315fc1" text-anchor="start">MIGRATION TARGET  /  one Azure Windows VM; distinct PostgreSQL services</text><g data-node="stage"><rect x="45" y="395" width="430" height="126" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="45" y="407" width="4" height="102" rx="2" fill="#315fc1"/><text x="61" y="425" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">PostgreSQL Stage</text><text x="61" y="451" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Isolated port, data, identity and backup</text><text x="61" y="474" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Restore accepted artifact; qualify behavior</text><text x="61" y="497" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Not a production writer</text></g><g data-node="prod"><rect x="525" y="395" width="430" height="126" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="525" y="407" width="4" height="102" rx="2" fill="#315fc1"/><text x="541" y="425" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">PostgreSQL Production</text><text x="541" y="451" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">milstrip_app + accepted dbo compatibility</text><text x="541" y="474" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Migrated history / commands / releases</text><text x="541" y="497" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Production identity recorded before GO</text></g><polyline points="830,258 830,300 740,300 740,395" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="475,458 525,458" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="45" y="568" font-size="19" font-weight="400" fill="#142b45" text-anchor="start">Separate services on one VM are not high availability; the failure domain is shared.</text><text x="45" y="602" font-size="19" font-weight="400" fill="#142b45" text-anchor="start">Backups / WAL / configuration recovery must meet agreed and rehearsed RPO/RTO.</text><text x="45" y="636" font-size="19" font-weight="400" fill="#142b45" text-anchor="start">The current localhost development database is not the future production service.</text><g data-node="sql"><rect x="30" y="735" width="440" height="130" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="30" y="747" width="4" height="106" rx="2" fill="#a86b0c"/><text x="46" y="765" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Azure SQL rollback baseline</text><text x="46" y="791" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Frozen after writer cutover</text><text x="46" y="814" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">30 stable days after PG acceptance</text><text x="46" y="837" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">No blind failback after new PG writes</text></g><g data-node="downstream"><rect x="530" y="735" width="440" height="130" rx="10" fill="#ffffff" stroke="#53657d" stroke-width="1.7"/><rect x="530" y="747" width="4" height="106" rx="2" fill="#53657d"/><text x="546" y="765" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Qualified downstream contract</text><text x="546" y="791" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Consumer / connection changes accepted</text><text x="546" y="814" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">No replacement of SCALE or Boomi</text><text x="546" y="837" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Observed acknowledgements retained</text></g><polyline points="740,521 985,521 985,706 750,706 750,735" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="902" font-size="14" font-weight="400" fill="#60758c" text-anchor="start">MILSTRIP  |  September 23, 2026  |  Public guide v1.1.0 | Recorded state, not live service status</text></g></svg>