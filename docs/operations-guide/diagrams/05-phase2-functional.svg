<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="890" viewBox="0 0 1000 890" role="img" aria-labelledby="title desc">
<title id="title">Phase 2 release and acknowledgement</title><desc id="desc">Phase 2 release and acknowledgement. PROPOSED. Full text equivalent is in the operating guide.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758c"/></marker></defs>
<rect width="1000" height="890" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="48" font-size="29" font-weight="700" fill="#142b45" text-anchor="start">Phase 2 release and acknowledgement</text><rect x="30" y="68" width="108" height="30" rx="15" fill="#315fc1"/><text x="44" y="89" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">PROPOSED</text><text x="30" y="126" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">PROPOSED production workflow. Handoff and downstream receipt are separate events.</text><g data-node="intake"><rect x="30" y="160" width="280" height="104" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="30" y="172" width="4" height="80" rx="2" fill="#315fc1"/><text x="46" y="190" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Intake receipt</text><text x="46" y="216" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Source and validation stored</text><text x="46" y="239" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Request ID + received time</text></g><g data-node="review"><rect x="360" y="160" width="280" height="104" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="360" y="172" width="4" height="80" rx="2" fill="#315fc1"/><text x="376" y="190" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Authorized review</text><text x="376" y="216" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Decision + reason + version</text><text x="376" y="239" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Reject unresolved business data</text></g><g data-node="gate"><rect x="690" y="160" width="280" height="104" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="690" y="172" width="4" height="80" rx="2" fill="#a86b0c"/><text x="706" y="190" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Release eligibility</text><text x="706" y="216" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Approval, role and live checks</text><text x="706" y="239" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Accepted delivery contract</text></g><polyline points="310,212 360,212" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,212 690,212" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><g data-node="hold"><rect x="30" y="350" width="280" height="125" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="30" y="362" width="4" height="101" rx="2" fill="#a86b0c"/><text x="46" y="380" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Hold and correct</text><text x="46" y="406" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Invalid / missing references</text><text x="46" y="429" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">No business write</text><text x="46" y="452" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Preserve evidence</text></g><g data-node="command"><rect x="360" y="350" width="280" height="125" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="360" y="362" width="4" height="101" rx="2" fill="#315fc1"/><text x="376" y="380" font-size="18.916857360793287" font-weight="700" fill="#142b45" text-anchor="start">Durable release command</text><text x="376" y="406" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Unique ID + payload + version</text><text x="376" y="429" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">One authoritative DB writer</text><text x="376" y="452" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Atomic claim / transaction</text></g><g data-node="stop"><rect x="690" y="350" width="280" height="125" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="690" y="362" width="4" height="101" rx="2" fill="#a86b0c"/><text x="706" y="380" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Not eligible</text><text x="706" y="406" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Do not release</text><text x="706" y="429" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Resolve role, review or data</text><text x="706" y="452" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">then re-evaluate eligibility</text></g><polyline points="170,264 170,350" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="132.5" y="298" width="75" height="23" rx="5" fill="#ffffff"/><text x="170" y="315" font-size="16" font-weight="400" fill="#142b45" text-anchor="middle">invalid</text><polyline points="830,264 830,350" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="815.0" y="298" width="30" height="23" rx="5" fill="#ffffff"/><text x="830" y="315" font-size="16" font-weight="400" fill="#142b45" text-anchor="middle">no</text><polyline points="830,264 830,304 500,304 500,350" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><rect x="493.0" y="281" width="84" height="23" rx="5" fill="#ffffff"/><text x="535" y="298" font-size="16" font-weight="400" fill="#142b45" text-anchor="middle">eligible</text><g data-node="commit"><rect x="360" y="555" width="280" height="125" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="360" y="567" width="4" height="101" rx="2" fill="#315fc1"/><text x="376" y="585" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Handoff outcome</text><text x="376" y="611" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Inserted / duplicate / rejected</text><text x="376" y="634" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Read back committed outcome</text><text x="376" y="657" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Destination reference + time</text></g><g data-node="uncertain"><rect x="690" y="555" width="280" height="125" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="690" y="567" width="4" height="101" rx="2" fill="#a86b0c"/><text x="706" y="585" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Outcome uncertain</text><text x="706" y="611" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Reconcile SAME command</text><text x="706" y="634" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">No blind retry / manual insert</text><text x="706" y="657" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Escalate unresolved state</text></g><polyline points="500,475 500,555" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,618 690,618" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g data-node="ack"><rect x="360" y="740" width="610" height="100" rx="10" fill="#ffffff" stroke="#315fc1" stroke-width="1.7"/><rect x="360" y="752" width="4" height="76" rx="2" fill="#315fc1"/><text x="376" y="770" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Downstream receipt</text><text x="376" y="796" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Record receiver reference, outcome and timestamp.</text><text x="376" y="819" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Show accepted or rejected; receipt is not shipment.</text></g><polyline points="500,680 500,740" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><rect x="422.0" y="701" width="156" height="23" rx="5" fill="#ffffff"/><text x="500" y="718" font-size="16" font-weight="400" fill="#142b45" text-anchor="middle">accepted handoff</text><g data-node="route"><rect x="30" y="555" width="280" height="193" rx="10" fill="#ffffff" stroke="#a86b0c" stroke-width="1.7"/><rect x="30" y="567" width="4" height="169" rx="2" fill="#a86b0c"/><text x="46" y="585" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Exactly one route</text><text x="46" y="611" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">SQL contract is the proposed</text><text x="46" y="634" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">baseline for planning.</text><text x="46" y="657" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">If Rainbow is selected:</text><text x="46" y="680" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">outbox + serializer + transport</text><text x="46" y="703" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">need separate acceptance.</text></g><text x="30" y="872" font-size="14" font-weight="400" fill="#60758c" text-anchor="start">MILSTRIP  |  September 23, 2026  |  Version 1.2.0</text></g></svg>