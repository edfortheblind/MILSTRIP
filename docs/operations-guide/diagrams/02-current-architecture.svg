marker-end="url(#arrow)"/><rect x="20" y="380" width="960" height="315" rx="14" fill="#e8f5f1" stroke="#087f6c" stroke-opacity=".25"/><text x="36" y="408" font-size="17" font-weight="700" fill="#087f6c" text-anchor="start">DEVELOPMENT LAPTOP  /  required for current execution</text><g data-node="gateway"><rect x="40" y="440" width="280" height="105" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="40" y="452" width="4" height="81" rx="2" fill="#087f6c"/><text x="56" y="470" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Standard gateway</text><text x="56" y="496" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Existing DEV gateway</text><text x="56" y="519" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Existing cloud-to-local bridge</text></g><g data-node="api"><rect x="360" y="440" width="280" height="105" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="360" y="452" width="4" height="81" rx="2" fill="#087f6c"/><text x="376" y="470" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">FastAPI + parser</text><text x="376" y="496" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">127.0.0.1:8000 / api/v1</text><text x="376" y="519" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Basic auth; loopback guard</text></g><g data-node="pg"><rect x="680" y="440" width="280" height="105" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="680" y="452" width="4" height="81" rx="2" fill="#087f6c"/><text x="696" y="470" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Local PostgreSQL</text><text x="696" y="496" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Approved local DEV database</text><text x="696" y="519" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">milstrip_app metadata</text></g><polyline points="755,305 755,357 180,357 180,440" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="320,492 360,492" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,492 680,492" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="590" font-size="20" font-weight="400" fill="#142b45" text-anchor="start">Gateway → API: HTTP on loopback only. API → DB: psycopg / localhost:5432.</text><text x="48" y="622" font-size="20" font-weight="400" fill="#142b45" text-anchor="start">Review audit uses the shared connection identity, not the Power Apps user.</text><text x="48" y="654" font-size="19" font-weight="400" fill="#142b45" text-anchor="start">Credentials remain private; no secrets are included in the app or this guide.</text><rect x="20" y="727" width="960" height="63" rx="14" fill="#f0f3f7" stroke="#53657d" stroke-opacity=".25"/><text x="36" y="755" font-size="17" font-weight="700" fill="#53657d" text-anchor="start">NO RUNTIME LINK TO PRODUCTION SQL  /  no legacy writer, CSV export or FTP delivery</text><text x="30" y="817" font-size="14" font-weight="400" fill="#60758c" text-anchor="start">MILSTRIP  |  September 23, 2026  |  Public guide v1.1.0 | Recorded state, not live service status</text></g></svg>