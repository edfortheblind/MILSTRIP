<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" role="img" aria-labelledby="title desc">
<title id="title">Stage and Prod architecture</title><desc id="desc">Stage and Prod architecture. CURRENT. Full text equivalent is in the operating guide.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758c"/></marker></defs>
<rect width="1000" height="980" fill="#ffffff"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="30" y="48" font-size="29" font-weight="700" fill="#142b45" text-anchor="start">Stage and Prod architecture</text><rect x="30" y="68" width="98" height="30" rx="15" fill="#087f6c"/><text x="44" y="89" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">CURRENT</text><text x="30" y="126" font-size="18" font-weight="400" fill="#52657d" text-anchor="start">Published for limited acceptance; second-user and role checks remain pending.</text><rect x="20" y="150" width="960" height="290" rx="14" fill="#e8f5f1" stroke="#087f6c" stroke-opacity=".25"/><text x="36" y="178" font-size="17" font-weight="700" fill="#087f6c" text-anchor="start">POWER PLATFORM CLOUD  /  existing apps, solution and connector</text><g data-node="stage-app"><rect x="50" y="205" width="370" height="90" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="50" y="217" width="4" height="66" rx="2" fill="#087f6c"/><text x="66" y="235" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">MILSTRIP Stage</text><text x="66" y="261" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Version 16 Live; Ready verified</text><text x="66" y="284" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Current administrator licensed</text></g><g data-node="prod-app"><rect x="50" y="320" width="370" height="90" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="50" y="332" width="4" height="66" rx="2" fill="#087f6c"/><text x="66" y="350" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">MILSTRIP Prod</text><text x="66" y="376" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Version 6 Live; admin available</text><text x="66" y="399" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Business database disabled</text></g><g data-node="broker"><rect x="570" y="190" width="370" height="100" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="570" y="202" width="4" height="76" rx="2" fill="#087f6c"/><text x="586" y="220" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Stage / Prod SSO brokers</text><text x="586" y="246" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Office 365 Users: invoker identity</text><text x="586" y="269" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">One fixed environment per broker</text></g><g data-node="connector"><rect x="570" y="325" width="370" height="100" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="570" y="337" width="4" height="76" rx="2" fill="#087f6c"/><text x="586" y="355" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Existing custom connector</text><text x="586" y="381" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Private embedded connections</text><text x="586" y="404" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Fixed Stage / Prod credentials</text></g><polyline points="420,250 500,250 500,230 570,230" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="420,365 470,365 470,265 570,265" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="755,290 755,325" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="480" width="960" height="190" rx="14" fill="#e8f5f1" stroke="#087f6c" stroke-opacity=".25"/><text x="36" y="508" font-size="17" font-weight="700" fill="#087f6c" text-anchor="start">API HOST  /  currently the laptop</text><g data-node="gateway"><rect x="40" y="535" width="280" height="105" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="40" y="547" width="4" height="81" rx="2" fill="#087f6c"/><text x="56" y="565" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Standard gateway</text><text x="56" y="591" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Existing cloud-to-local bridge</text><text x="56" y="614" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">HTTP to the loopback API</text></g><g data-node="api"><rect x="360" y="535" width="280" height="105" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="360" y="547" width="4" height="81" rx="2" fill="#087f6c"/><text x="376" y="565" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Shared API + parser</text><text x="376" y="591" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Broker-only; single worker</text><text x="376" y="614" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">One backend for both apps</text></g><g data-node="profiles"><rect x="680" y="535" width="280" height="105" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="680" y="547" width="4" height="81" rx="2" fill="#087f6c"/><text x="696" y="565" font-size="18.916857360793287" font-weight="700" fill="#142b45" text-anchor="start">Fixed database profiles</text><text x="696" y="591" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">In-app Configuration</text><text x="696" y="614" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Save / Test / Apply</text></g><polyline points="755,425 755,462 180,462 180,535" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="320,587 360,587" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,587 680,587" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="710" width="960" height="160" rx="14" fill="#e8f5f1" stroke="#087f6c" stroke-opacity=".25"/><text x="36" y="738" font-size="17" font-weight="700" fill="#087f6c" text-anchor="start">DATABASE TARGETS  /  Stage and Prod must be different</text><g data-node="stage-db"><rect x="45" y="755" width="430" height="90" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="45" y="767" width="4" height="66" rx="2" fill="#087f6c"/><text x="61" y="785" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Stage: local PostgreSQL</text><text x="61" y="811" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Intake, validation, reviews and audit</text><text x="61" y="834" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Runtime tested; retained test preserved</text></g><g data-node="prod-db"><rect x="525" y="755" width="430" height="90" rx="10" fill="#ffffff" stroke="#087f6c" stroke-width="1.7"/><rect x="525" y="767" width="4" height="66" rx="2" fill="#087f6c"/><text x="541" y="785" font-size="21" font-weight="700" fill="#142b45" text-anchor="start">Prod: disabled</text><text x="541" y="811" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">PostgreSQL or Azure SQL configurable</text><text x="541" y="834" font-size="18" font-weight="400" fill="#142b45" text-anchor="start">Independent target and acceptance required</text></g><polyline points="820,640 820,690 255,690 255,755" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="820,690 740,690 740,755" fill="none" stroke="#60758c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="45" y="908" font-size="19" font-weight="400" fill="#142b45" text-anchor="start">Both apps share backend releases and restarts. Changing a string does not move data.</text><text x="45" y="939" font-size="19" font-weight="400" fill="#142b45" text-anchor="start">Azure SQL runtime and production handoff remain unverified; no downstream delivery.</text><text x="30" y="962" font-size="14" font-weight="400" fill="#60758c" text-anchor="start">MILSTRIP  |  September 25, 2026  |  Version 1.6.0</text></g></svg>